services:
  web:
    build: .
    container_name: lms_web
    restart: unless-stopped
    # FIX: дополнительный барьер против эскалации из контейнера.
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_ALLOWED_HOSTS=${DOMAIN_NAME},localhost,127.0.0.1
      # FIX: в режиме прода внутри compose база всегда доступна по хосту «db»,
      # поэтому принудительно задаём DB_HOST/DB_PORT — иначе приложение при
      # DB_ENGINE=postgresql пытается стучаться в localhost и падает с
      # «connection refused» / «could not connect to server».
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
    depends_on:
      db:
        condition: service_healthy
        restart: true
        required: false   # сервис опционален (профиль postgres) — не блокирует запуск без него
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"
    # FIX: healthcheck через HTTP-запрос к gunicorn вместо «manage.py check»:
    # 1) manage.py check не проверяет, что приложение реально обслуживает
    #    запросы — healthy-статус наступал до готовности сайта;
    # 2) в slim-образе нет curl/wget, поэтому проверка сделана на python
    #    (он есть в образе всегда); ответы <400 (в т.ч. 301 редирект
    #    /admin/ на логин) считаются успехом.
    # start_period 40s + retries 30 дают ~5 минут на миграции при первом
    # старте, чтобы `up -d --wait` не падал раньше времени.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen('http://127.0.0.1:8000/admin/', timeout=5) as r:
                  sys.exit(0 if r.status < 400 else 1)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code < 400 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  # FIX: PostgreSQL для режима прода. Включается профилем «postgres»:
  #   docker compose --profile postgres up -d   (или make deploy POSTGRES=1)
  # Чтобы web использовал эту базу, в .env должно быть DB_ENGINE=django.db.backends.postgresql.
  db:
    image: postgres:16-alpine
    container_name: lms_db
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${DB_NAME:-lms_db}
      - POSTGRES_USER=${DB_USER:-lms_user}
      # FIX: postgres требует пароль — без него контейнер не стартует.
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env when using the postgres profile}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: lms_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - static_data:/srv/static
      - media_data:/srv/media
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - web

volumes:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
  pg_data:
